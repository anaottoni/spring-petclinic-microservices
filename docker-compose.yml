# Stack enxuta para o experimento controlado (comparação justa com o modulith):
# API Gateway + Customers + Vets + PostgreSQL.
# Sem Config Server, Eureka, Visits, GenAI, Admin, Zipkin, Grafana ou Prometheus.
services:
  postgres:
    image: postgres:18.1
    container_name: petclinic-micro-postgres
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - micro_postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - petclinic-net

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customers
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - petclinic-net

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vets
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - petclinic-net

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CUSTOMERS_SERVICE_URL: http://customers-service:8081
      VETS_SERVICE_URL: http://vets-service:8083
    depends_on:
      customers-service:
        condition: service_healthy
      vets-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - petclinic-net

volumes:
  micro_postgres_data:

networks:
  petclinic-net:
    driver: bridge
