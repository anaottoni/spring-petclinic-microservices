spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          # Sem CircuitBreaker/Retry: no experimento, 503 artificial distorce a
          # comparação com o monólito (que não tem fallback).
          routes:
            - id: vets-service
              uri: ${VETS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: ${CUSTOMERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
  reactor:
    context-propagation: auto
  messages:
    basename: messages/messages

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 2048

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: false

logging:
  level:
    org.springframework: INFO

---
spring:
  config:
    activate:
      on-profile: docker
