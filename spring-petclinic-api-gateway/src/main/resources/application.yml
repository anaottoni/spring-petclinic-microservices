spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: vets-service
              uri: ${VETS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/vets/**
            - id: customers-service
              uri: ${CUSTOMERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/owners/**,/api/pet-types

server:
  port: 8080

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: false

logging:
  level:
    org.springframework: INFO

---
spring:
  config:
    activate:
      on-profile: docker
